name: Create Release Tag

# Every app-source push to main ships a release. Website-only changes use the
# Pages workflow and must not create an app tag or invoke Apple notarization.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'web/**'

# `contents: write` creates the immutable version tag. `actions: write` starts
# release.yml explicitly: a tag made with GITHUB_TOKEN cannot itself trigger a
# second push workflow, whereas workflow_dispatch is allowed by GitHub.
permissions:
  contents: write
  actions: write

# Serialize calculation + tag creation. Without this, two quick pushes could
# both choose the same next version before either tag reaches origin.
concurrency:
  group: auto-release-tag-main
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history and tags
        # v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: Create the next semantic release tag
        id: tag
        run: |
          # Re-running this workflow must not mint a second release for the
          # same commit. This also makes an intentionally pre-tagged commit a
          # no-op here; its tag's normal push trigger owns that release.
          if git tag --points-at "$GITHUB_SHA" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="$(bash scripts/next-release-version.sh "$GITHUB_SHA")"
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            existing_commit="$(git rev-list -n 1 "$TAG")"
            if [ "$existing_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Calculated $TAG, but that tag already points at $existing_commit."
              exit 1
            fi
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Start the signed release workflow
        if: steps.tag.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
